[package]
name = "rigloop"
version = "0.2.1"
edition = "2024"
description = "A small agent loop harness for Rig."
license = "MIT OR Apache-2.0"
repository = "https://github.com/danthegoodman1/test-rig"
readme = "README.md"
keywords = ["rig", "agent", "llm", "async"]
categories = ["asynchronous"]

[dependencies]
futures = "0.3.32"
rig = "0.42.0"
rig-memory = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.52.3", features = ["macros", "rt", "sync", "time"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[dev-dependencies]
anyhow = "1.0.102"
bytes = "1.12.1"
rig = { version = "0.42.0", features = ["test-utils"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "test-util", "time"] }
